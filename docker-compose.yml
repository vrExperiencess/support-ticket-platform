name: support-ticket-platform

services:

  # ===================================================
  # PostgreSQL
  # ===================================================

  database:
    image: postgres:17-alpine

    container_name: support_ticket_database

    env_file:
      - .env.docker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - support_network


  # ===================================================
  # NestJS Backend
  # ===================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: support_ticket_backend

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

    restart: unless-stopped

    networks:
      - support_network


  # ===================================================
  # React + Nginx
  # ===================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: /api

    container_name: support_ticket_frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

    networks:
      - support_network


# =====================================================
# Persistent volumes
# =====================================================

volumes:
  postgres_data:
    driver: local


# =====================================================
# Internal Docker network
# =====================================================

networks:
  support_network:
    driver: bridge